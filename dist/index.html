<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Money Control — Take control of your money. Track cash, bank accounts, UPI wallets, transfers, and expenses with a modern multi-account dashboard." />
  <meta name="theme-color" content="#6C63FF" />

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money Control" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#6C63FF" />

  <!-- Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

  <title>💰 Money Control — Multi-Account Finance Tracker</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Styles (Used for Vite dev server) -->
  <script type="module" crossorigin src="/assets/app-bundle.kij0Y-QY.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index.CKMUAf2n.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="modal-root"></div>
  <div id="pin-lock-root"></div>
  <div id="pwa-install-banner"></div>
  <div id="offline-banner"></div>

  <!-- Primary Entry Point for Vite (npm run dev / npm run build) -->

  <!-- Fallback for static servers (e.g. live-server on port 4000 without Vite transpile) -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.message && (e.message.includes('module specifier') || e.message.includes('import'))) {
        console.info('Static HTTP server detected without Vite transpiler. Loading bundle...');
        if (!document.getElementById('fallback-bundle-js')) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = '/dist/assets/index.css';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.id = 'fallback-bundle-js';
          js.type = 'module';
          js.src = '/dist/assets/app-bundle.js';
          document.body.appendChild(js);
        }
      }
    }, true);
  </script>
</body>
</html>
