<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Money Control — Take control of your money. Track cash, bank accounts, UPI wallets, transfers, and expenses with a modern multi-account dashboard." />
  <meta name="theme-color" content="#6C63FF" />

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money Control" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#6C63FF" />

  <!-- Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

  <title>💰 Money Control — Multi-Account Finance Tracker</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Import Map for ES Module Specifiers -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "/node_modules/firebase/app/dist/index.mjs",
        "firebase/auth": "/node_modules/firebase/auth/dist/esm/index.esm.js",
        "firebase/firestore": "/node_modules/firebase/firestore/dist/index.mjs",
        "chart.js": "/node_modules/chart.js/auto/auto.js"
      }
    }
  </script>

  <!-- App Styles -->
  <link rel="stylesheet" href="/src/styles/index.css" />
  <link rel="stylesheet" href="/src/styles/animations.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/auth.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />
  <link rel="stylesheet" href="/src/styles/analytics.css" />
  <link rel="stylesheet" href="/src/styles/pinlock.css" />
  <link rel="stylesheet" href="/src/styles/responsive.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <div id="modal-root"></div>
  <div id="pin-lock-root"></div>
  <div id="pwa-install-banner"></div>
  <div id="offline-banner"></div>
  <!-- Smart Dual Loader: Vite Dev Server + Static HTTP Server (live-server port 4000) fallback -->
  <script type="module">
    window.__appLoaded = false;
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!window.__appLoaded) {
          console.warn('Vite dev server not active. Mounting application bundle...');
          const script = document.createElement('script');
          script.type = 'module';
          script.src = '/dist/assets/app-bundle.js';
          document.body.appendChild(script);
        }
      }, 250);
    });
  </script>

  <script type="module">
    import '/src/main.js';
    window.__appLoaded = true;
  </script>
</body>
</html>
